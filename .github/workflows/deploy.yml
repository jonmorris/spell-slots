name: Deploy to GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Deploy whichever branch is the repository default, rather than hard-coding
    # a name: this repo's default is the branch the first push created, and this
    # keeps working unchanged if it is later renamed to main.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Playwright is only needed for `npm run verify`, which is not part of
      # the deploy; skip its browser download to keep the install quick.
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm test
      - name: Build
        # A project Pages site is served from /<repo>/, so the base path and the
        # service worker scope have to match.
        run: BASE_PATH="/${GITHUB_REPOSITORY#*/}/" npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
